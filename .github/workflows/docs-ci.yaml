name: docs-ci
on:
  push:
    branches:
      - main
      - add-docs-portal
    paths:
      - docs/**
  pull_request:
    paths:
      - docs/**
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      # The build fails on broken links and anchors, so this is the gate that keeps
      # a bad docs change from reaching main. It runs on pull requests too.
      - run: npm run build
        working-directory: docs
      - name: Verify documentation URLs referenced from the codebase still resolve
        run: python3 scripts/check_docs_urls.py
      - name: Upload the built site for the deploy job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: docs-site
          path: docs/build
          if-no-files-found: error
          retention-days: 1

  # The only step that pushes is the deploy step, so it is the only job that
  # needs contents: write. It runs after the build gate and only on push.
  deploy:
    needs: docs
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the built site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: docs-site
          path: docs/build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build
          cname: docs.pr-agent.ai
