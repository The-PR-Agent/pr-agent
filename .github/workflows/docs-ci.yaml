name: docs-ci
on:
  push:
    branches:
      - main
      - add-docs-portal
    paths:
      - docs/**
  pull_request:
    paths:
      - docs/**
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      # The build fails on broken links and anchors, so this is the gate that keeps
      # a bad docs change from reaching main. It runs on pull requests too.
      - run: npm run build
        working-directory: docs
      - name: Verify documentation URLs referenced from the codebase still resolve
        run: python3 scripts/check_docs_urls.py
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e  # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build
          cname: docs.pr-agent.ai
