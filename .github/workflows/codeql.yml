name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly on Monday at 06:00 UTC — catches advisories that landed
    # without a corresponding code change in this repo.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # PR checkouts use merge commits; fetch both parents for HEAD^1/HEAD^2.
          fetch-depth: 2

      # Keep the CodeQL check present on PRs, but avoid scanning unchanged Python.
      - id: docs
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git rev-parse -q --verify 'HEAD^2' > /dev/null &&
             git diff --no-renames --quiet HEAD^1 HEAD -- . \
               ':(top,exclude,glob)docs/docs/**/*.md' \
               ':(top,exclude,glob)docs/docs/**/*.mdx'; then
            echo 'docs_only=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        if: steps.docs.outputs.docs_only != 'true'
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        if: steps.docs.outputs.docs_only != 'true'
        with:
          category: "/language:${{ matrix.language }}"
