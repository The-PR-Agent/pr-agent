name: Build-and-test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: >-
    pr-agent-build-and-test-${{ github.event_name }}-${{
      github.event_name == 'pull_request' && github.run_attempt == 1 &&
      format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

permissions:
  contents: read

jobs:
  classify_changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.docs.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: docs
        shell: bash
        run: |
          # For PR merge commits, only changes outside the safe docs paths matter.
          if git rev-parse -q --verify 'HEAD^2' > /dev/null &&
             git diff --no-renames --quiet HEAD^1 HEAD -- . \
               ':(top,exclude,glob)docs/docs/**/*.md' \
               ':(top,exclude,glob)docs/docs/**/*.mdx' \
               ':(top,exclude)README.md' \
               ':(top,exclude)CONTRIBUTING.md' \
               ':(top,exclude)SECURITY.md'; then
            echo 'docs_only=true' >> "$GITHUB_OUTPUT"
          fi

  review-context-hardening:
    name: Review context hardening (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        run: pipx install uv==0.13.8

      - name: Install test dependencies and verified grammars
        id: hardening-dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --python 3.12
          tooling="$GITHUB_WORKSPACE/scripts/review_context"
          uv pip install --python .venv/bin/python \
            --require-hashes --only-binary :all: -r "$tooling/requirements.txt"
          grammars="$RUNNER_TEMP/review-context-grammars"
          mkdir -p "$grammars"
          cd "$grammars"
          curl --fail --silent --show-error --location --max-time 60 \
            https://github.com/xberg-io/tree-sitter-language-pack/releases/download/v1.22.1/parsers-linux-x86_64.tar.zst \
            --output parsers-linux-x86_64.tar.zst
          sha256sum --check "$tooling/grammars.sha256"
          tar --zstd --extract --file parsers-linux-x86_64.tar.zst --no-same-owner

      - name: Test review context hardening
        id: hardening-test
        env:
          GRAMMAR_CACHE: ${{ runner.temp }}/review-context-grammars
          PYTHONPATH: .
        run: uv run --frozen --python 3.12 pytest scripts/review_context -q

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      - id: docs_pages
        name: Detect documentation-only PR
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          # Only documentation pages are safe to skip Docker validation for.
          if git rev-parse -q --verify 'HEAD^2' > /dev/null &&
             git diff --no-renames --quiet HEAD^1 HEAD -- . \
               ':(top,exclude,glob)docs/docs/**/*.md' \
               ':(top,exclude,glob)docs/docs/**/*.mdx'; then
            echo 'docs_only=true' >> "$GITHUB_OUTPUT"
            echo '::notice::Docs-only PR: Docker tests skipped; packaging and documentation checks retained'
          fi

      - id: uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: '0.13.8'
          resolution-strategy: lowest

      - name: Check uv.lock
        run: uv lock --check

      - name: Test package artifacts
        run: uv run pytest -q tests/packaging/test_help_docs_package.py

      - name: Test documentation contracts
        if: steps.docs_pages.outputs.docs_only == 'true'
        run: |
          PYTHONPATH=. uv run pytest -q \
            tests/unittest/test_docs_help_corpus.py \
            tests/unittest/test_docs_nav_parity.py \
            tests/unittest/test_docs_urls.py \
            tests/unittest/test_config_reference.py \
            tests/unittest/test_command_descriptions.py \
            tests/unittest/test_similar_issue_qdrant_collection.py \
            tests/unittest/test_unreachable_code.py \
            tests/unittest/test_ci_docs_only_docker.py

      - id: dockerx
        name: Setup Docker Buildx
        if: steps.docs_pages.outputs.docs_only != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - id: build
        name: Build dev docker
        if: steps.docs_pages.outputs.docs_only != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          load: true
          tags: pragent/pr-agent:test
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev
          target: test

      - id: test
        name: Test dev docker
        if: steps.docs_pages.outputs.docs_only != 'true'
        run: |
          docker run --name test_container pragent/pr-agent:test pytest -v tests/unittest --cov=pr_agent --cov-report term --cov-report xml:coverage.xml
          docker cp test_container:/app/coverage.xml coverage.xml
          docker rm test_container

      - name: Validate coverage report
        if: steps.docs_pages.outputs.docs_only != 'true'
        run: |
          if [ ! -f coverage.xml ]; then
            echo "Coverage report not found"
            exit 1
          fi
      - name: Upload coverage to Codecov
        if: steps.docs_pages.outputs.docs_only != 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      # Unit tests override CMD, so a broken server launcher never fails CI.
      # Smoke-start github_app (gunicorn + uvicorn) with no secrets; GET / → 200.
      - id: build-smoke
        name: Build github_app docker
        if: steps.docs_pages.outputs.docs_only != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          load: true
          tags: pragent/pr-agent:smoke
          cache-from: type=gha,scope=dev
          target: github_app

      - id: smoke
        name: Smoke-start the github_app container
        if: steps.docs_pages.outputs.docs_only != 'true'
        run: |
          docker run -d --name pr-agent-smoke -p 3000:3000 pragent/pr-agent:smoke
          for _ in $(seq 1 15); do
            if curl -sf -o /dev/null http://localhost:3000/; then
              echo "container is serving"
              docker rm -f pr-agent-smoke
              exit 0
            fi
            sleep 2
          done
          echo "container did not come up"
          docker logs pr-agent-smoke
          docker rm -f pr-agent-smoke
          exit 1

  # The job above runs entirely inside docker/Dockerfile, whose base moved to
  # python:3.14.7-slim in #3294. That leaves neither interpreter pyproject
  # actually claims support for exercised there: not the `requires-python`
  # floor of 3.12, and not the 3.13 the google-cloud-storage pin applies at.
  # Installing from PyPI on either was an untested combination. Deliberately
  # separate from the docker build rather than a matrix over it: the shipped
  # images track one interpreter on purpose, and matrixing would rebuild every
  # layer and re-run the smoke test and coverage upload for no extra signal.
  unit-tests-native:
    name: Unit tests (Python ${{ matrix.python-version }})
    needs: classify_changes
    if: ${{ always() && !cancelled() && needs.classify_changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Same uv release the Dockerfile pulls from ghcr.io/astral-sh/uv, via pipx
      # so there is no additional action to pin. uv provisions the interpreter
      # itself, so setup-python is not needed either.
      - id: uv
        name: Install uv
        run: pipx install uv==0.13.8

      - id: test
        name: Test on Python ${{ matrix.python-version }}
        env:
          PYTHONPATH: .
          # See docker/Dockerfile's base stage: pin litellm's bundled cost map so
          # a remote change to it cannot redden the suite without a version bump.
          LITELLM_LOCAL_MODEL_COST_MAP: "True"
        run: uv run --frozen --python ${{ matrix.python-version }} pytest -v tests/unittest
