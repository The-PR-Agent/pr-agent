name: Build-and-test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - id: uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      - name: Check uv.lock
        run: uv lock --check

      - name: Test package artifacts
        run: uv run pytest -q tests/packaging/test_help_docs_package.py

      - id: dockerx
        name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - id: build
        name: Build dev docker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          load: true
          tags: pragent/pr-agent:test
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev
          target: test

      - id: test
        name: Test dev docker
        run: |
          docker run --name test_container pragent/pr-agent:test pytest -v tests/unittest --cov=pr_agent --cov-report term --cov-report xml:coverage.xml
          docker cp test_container:/app/coverage.xml coverage.xml
          docker rm test_container

      - name: Validate coverage report
        run: |
          if [ ! -f coverage.xml ]; then
            echo "Coverage report not found"
            exit 1
          fi
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      # Unit tests override CMD, so a broken server launcher never fails CI.
      # Smoke-start github_app (gunicorn + uvicorn) with no secrets; GET / → 200.
      - id: build-smoke
        name: Build github_app docker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          load: true
          tags: pragent/pr-agent:smoke
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev
          target: github_app

      - id: smoke
        name: Smoke-start the github_app container
        run: |
          docker run -d --name pr-agent-smoke -p 3000:3000 pragent/pr-agent:smoke
          for _ in $(seq 1 15); do
            if curl -sf -o /dev/null http://localhost:3000/; then
              echo "container is serving"
              docker rm -f pr-agent-smoke
              exit 0
            fi
            sleep 2
          done
          echo "container did not come up"
          docker logs pr-agent-smoke
          docker rm -f pr-agent-smoke
          exit 1

  # The job above runs entirely inside docker/Dockerfile, whose base moved to
  # python:3.14.7-slim in #3294. That leaves neither interpreter pyproject
  # actually claims support for exercised there: not the `requires-python`
  # floor of 3.12, and not the 3.13 the google-cloud-storage pin applies at.
  # Installing from PyPI on either was an untested combination. Deliberately
  # separate from the docker build rather than a matrix over it: the shipped
  # images track one interpreter on purpose, and matrixing would rebuild every
  # layer and re-run the smoke test and coverage upload for no extra signal.
  unit-tests-native:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Same uv release the Dockerfile pulls from ghcr.io/astral-sh/uv, via pipx
      # so there is no additional action to pin. uv provisions the interpreter
      # itself, so setup-python is not needed either.
      - id: uv
        name: Install uv
        run: pipx install uv==0.12.10

      - id: test
        name: Test on Python ${{ matrix.python-version }}
        env:
          PYTHONPATH: .
          # See docker/Dockerfile's base stage: pin litellm's bundled cost map so
          # a remote change to it cannot redden the suite without a version bump.
          LITELLM_LOCAL_MODEL_COST_MAP: "True"
        run: uv run --frozen --python ${{ matrix.python-version }} pytest -v tests/unittest
