name: Provider smoke

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  github-provider-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          resolution-strategy: lowest

      - name: Install dependencies
        run: uv sync

      - name: Smoke /describe on a real GitHub PR
        env:
          GITHUB.USER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: PYTHONPATH=. uv run pytest tests/health_test/test_github_smoke.py -q
