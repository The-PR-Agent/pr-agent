name: Publish main review image

on:
  push:
    branches: [main]

permissions:
  contents: read

# Serialize the build and push; delayed reruns also build main as it stands now.
concurrency:
  group: publish-main-github-action
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build review image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: github_action
          platforms: linux/amd64
          push: false
          load: true
          tags: pragent/pr-agent:github_action-main
          labels: org.opencontainers.image.revision=${{ steps.checkout.outputs.commit }}
          cache-from: type=gha,scope=github_action-main
          cache-to: type=gha,mode=max,scope=github_action-main

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish current main image
        shell: bash
        run: |
          set -euo pipefail
          built_sha=$(git rev-parse HEAD)
          main_sha=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$main_sha" != "$built_sha" ]; then
            echo "Skipping superseded main image ($built_sha; main is $main_sha)."
            exit 0
          fi
          docker push pragent/pr-agent:github_action-main
