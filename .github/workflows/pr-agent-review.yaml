name: PR-Agent

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      comment_id:
        description: ID of an existing PR-Agent command comment to replay
        required: false
        type: string
      pr_number:
        description: PR number to replay its opened event (instead of comment_id)
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare_review:
    # A cheap pre-filter only: the "Authorize comment command" step is the real gate.
    if: >-
      github.event.sender.type != 'Bot' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request_target' && !github.event.pull_request.draft) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
          startsWith(github.event.comment.body, '/')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Prepare PR-Agent event
    outputs:
      allowed: ${{ steps.authorize.outputs.allowed }}
      event_name: ${{ steps.replay.outputs.event_name || github.event_name }}
      event_artifact_id: ${{ steps.replay-upload.outputs.artifact-id }}
      pr: ${{ steps.context-revision.outputs.pr }}
      base_sha: ${{ steps.context-revision.outputs.base_sha }}
      head_sha: ${{ steps.context-revision.outputs.head_sha }}
      tooling_sha: ${{ steps.context-tooling.outputs.sha }}
      instructions: ${{ steps.context-tooling.outputs.instructions }}
    steps:
      - name: Load PR event for manual replay
        if: github.event_name == 'workflow_dispatch'
        id: replay
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMENT_ID: ${{ inputs.comment_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$PR_NUMBER" ]]; then
            [[ -z "$COMMENT_ID" && "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "Supply only a numeric PR number"; exit 1; }
            gh api "repos/$GH_REPO/pulls/$PR_NUMBER" | jq -e --arg repository "$GH_REPO" '
              if .state != "open" or .draft then error("PR must be open and ready for review")
              else {action: "opened", pull_request: ., sender: {type: "User"},
                    repository: {full_name: $repository}}
              end' > "$GITHUB_WORKSPACE/pr-agent-event.json"
            {
              echo "event_name=pull_request_target"
              echo "event_path=/github/workspace/pr-agent-event.json"
              echo "host_event_path=$GITHUB_WORKSPACE/pr-agent-event.json"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$COMMENT_ID" =~ ^[0-9]+$ ]] || { echo "Invalid comment ID"; exit 1; }
          gh api "repos/$GH_REPO/issues/comments/$COMMENT_ID" > "$RUNNER_TEMP/pr-agent-comment.json"
          issue_number=$(jq -r '.issue_url | split("/") | last' "$RUNNER_TEMP/pr-agent-comment.json")
          gh api "repos/$GH_REPO/issues/$issue_number" > "$RUNNER_TEMP/pr-agent-issue.json"
          jq -n \
            --slurpfile comment "$RUNNER_TEMP/pr-agent-comment.json" \
            --slurpfile issue "$RUNNER_TEMP/pr-agent-issue.json" \
            --arg repository "$GH_REPO" '
            $comment[0] as $c | $issue[0] as $i |
            if $i.pull_request == null then error("Comment must belong to a pull request")
            else {action: "created", comment: $c, issue: $i, sender: $c.user,
                  repository: {full_name: $repository}}
            end' > "$GITHUB_WORKSPACE/pr-agent-event.json"
          {
            echo "event_path=/github/workspace/pr-agent-event.json"
            echo "host_event_path=$GITHUB_WORKSPACE/pr-agent-event.json"
            echo "event_name=issue_comment"
          } >> "$GITHUB_OUTPUT"

      # Comment commands spend the sponsored key, so only users with write access to the
      # repository may run them (author_association alone also admits triage and read roles).
      # /config and /settings are left out because they print configuration into the PR;
      # /similar_issue and /help_docs are left out because they cannot run in this setup.
      - name: Authorize comment command
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ steps.replay.outputs.event_name || github.event_name }}
          REPLAY_EVENT_FILE: ${{ steps.replay.outputs.host_event_path }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "issue_comment" ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # github.event_path is empty in step expressions; the runner always sets GITHUB_EVENT_PATH.
          EVENT_FILE=${REPLAY_EVENT_FILE:-$GITHUB_EVENT_PATH}
          body=$(jq -r '.comment.body // ""' "$EVENT_FILE")
          command=${body%%[[:space:]]*}
          case "$command" in
            /describe|/review|/improve|/ask|/help|/add_docs|/generate_labels|/update_changelog) ;;
            *)
              echo "::notice::Skipping: this comment command is not enabled for PR-Agent"
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          login=$(jq -r '.comment.user.login // ""' "$EVENT_FILE")
          role=$(gh api "repos/$GH_REPO/collaborators/$login/permission" --jq '.role_name' 2>/dev/null || echo none)
          case "$role" in
            admin|maintain|write)
              echo "allowed=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::notice::Skipping: comment commands require write access to the repository"
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Resolve review context revision
        id: context-revision
        if: steps.authorize.outputs.allowed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ steps.replay.outputs.event_name || github.event_name }}
          REPLAY_EVENT_FILE: ${{ steps.replay.outputs.host_event_path }}
        shell: bash
        run: |
          set -euo pipefail
          EVENT_FILE=${REPLAY_EVENT_FILE:-$GITHUB_EVENT_PATH}
          if [[ "$EVENT_NAME" == "issue_comment" ]]; then
            body=$(jq -r '.comment.body // ""' "$EVENT_FILE")
            [[ "${body%%[[:space:]]*}" == "/review" ]] || exit 0
            pr=$(jq -r '.issue.number' "$EVENT_FILE")
            [[ "$pr" =~ ^[0-9]+$ ]] || exit 1
            gh api "repos/$GH_REPO/pulls/$pr" > "$RUNNER_TEMP/review-context-pr.json"
          elif [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            jq '.pull_request' "$EVENT_FILE" > "$RUNNER_TEMP/review-context-pr.json"
          else
            exit 0
          fi
          metadata="$RUNNER_TEMP/review-context-pr.json"
          jq -e --arg repository "$GH_REPO" '.base.repo.full_name == $repository' "$metadata" > /dev/null
          pr=$(jq -r '.number' "$metadata")
          base_sha=$(jq -r '.base.sha' "$metadata")
          head_sha=$(jq -r '.head.sha' "$metadata")
          [[ "$pr" =~ ^[0-9]+$ && "$base_sha" =~ ^[0-9a-f]{40}$ && "$head_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          {
            echo "pr=$pr"
            echo "base_sha=$base_sha"
            echo "head_sha=$head_sha"
            echo "enabled=true"
          } >> "$GITHUB_OUTPUT"

      - name: Save manual replay event
        id: replay-upload
        if: github.event_name == 'workflow_dispatch' && steps.authorize.outputs.allowed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: review-event
          path: pr-agent-event.json
          if-no-files-found: error
          retention-days: 1

      # Resolve tooling and reading instructions on the default branch, independently of the PR target.
      - name: Check out default-branch review tooling
        id: tooling-checkout
        if: steps.context-revision.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tooling
          persist-credentials: false

      - name: Record trusted tooling revision and instructions
        id: context-tooling
        if: steps.tooling-checkout.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          tooling="$GITHUB_WORKSPACE/tooling"
          sha=$(git -C "$tooling" rev-parse HEAD)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          instructions=$(cat "$tooling/scripts/review_context/instructions.txt")
          delimiter=$(cat /proc/sys/kernel/random/uuid)
          {
            printf 'instructions<<%s\n%s\n%s\n' "$delimiter" "$instructions" "$delimiter"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

  review_context:
    needs: prepare_review
    if: needs.prepare_review.outputs.allowed == 'true' && needs.prepare_review.outputs.tooling_sha != ''
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Build review context without secrets
    steps:
      - name: Check out verified default-branch tooling
        id: context-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.prepare_review.outputs.tooling_sha }}
          path: tooling
          fetch-depth: 0
          persist-credentials: false

      - name: Set up review context Python runner
        id: context-uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: '0.13.8'
          enable-cache: false

      - name: Install hash-pinned context dependencies and grammars
        id: context-dependencies
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          tooling="$GITHUB_WORKSPACE/tooling/scripts/review_context"
          uv venv --python 3.12 "$RUNNER_TEMP/review-context-venv"
          uv pip install --python "$RUNNER_TEMP/review-context-venv/bin/python" \
            --require-hashes --only-binary :all: -r "$tooling/requirements.txt"
          grammars="$RUNNER_TEMP/review-context-grammars"
          mkdir -p "$grammars"
          cd "$grammars"
          curl --fail --silent --show-error --location --max-time 60 \
            https://github.com/xberg-io/tree-sitter-language-pack/releases/download/v1.22.1/parsers-linux-x86_64.tar.zst \
            --output parsers-linux-x86_64.tar.zst
          sha256sum --check "$tooling/grammars.sha256"
          tar --zstd --extract --file parsers-linux-x86_64.tar.zst --no-same-owner

      - name: Build review context
        id: context
        timeout-minutes: 3
        env:
          PR: ${{ needs.prepare_review.outputs.pr }}
          BASE_SHA: ${{ needs.prepare_review.outputs.base_sha }}
          HEAD_SHA: ${{ needs.prepare_review.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          tooling="$GITHUB_WORKSPACE/tooling"
          out="$GITHUB_WORKSPACE/review-context"
          rm -rf -- "$out"
          # Fetch objects only; neither the PR head nor its target branch supplies executable tooling.
          timeout 30s git -C "$tooling" fetch --no-tags --quiet origin "+refs/pull/$PR/head:refs/remotes/pr/head" "$BASE_SHA"
          test "$(git -C "$tooling" rev-parse refs/remotes/pr/head)" = "$HEAD_SHA"
          timeout 150s "$RUNNER_TEMP/review-context-venv/bin/python" -I \
            "$tooling/scripts/review_context/graph_bundle_ts.py" \
            --repo "$tooling" --base "$BASE_SHA" --head "$HEAD_SHA" --pr "$PR" --out-dir "$out" \
            --generic --grammar-cache "$RUNNER_TEMP/review-context-grammars"
          test -d "$out"
          test ! -L "$out"
          test -f "$out/pr$PR.G6.md"
          test ! -L "$out/pr$PR.G6.md"
          cp -- "$out/pr$PR.G6.md" "$out/bundle.md"

      # Only bundle bytes cross this job boundary, never parser-controlled step/job outputs or instructions.
      - name: Upload review context
        id: context-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: review-context
          path: review-context/bundle.md
          if-no-files-found: error
          retention-days: 1

  pr_agent_job:
    needs: [prepare_review, review_context]
    if: >-
      always() && !cancelled() && needs.prepare_review.result == 'success' &&
      needs.prepare_review.outputs.allowed == 'true'
    permissions:
      contents: read
      issues: write
      pull-requests: write
    # Job-level so comments that skip the job never join the group and cancel a queued command.
    concurrency:
      group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number || inputs.comment_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Run PR-Agent
    steps:
      - name: Load manual replay event
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare_review.outputs.event_artifact_id }}
          merge-multiple: true
          path: .

      - name: Download review context
        id: context-download
        if: needs.review_context.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: review-context
          path: review-context

      - name: Validate review context artifact
        id: context-artifact
        if: steps.context-download.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/review-context"
          test -d "$out"
          test ! -L "$out"
          test -f "$out/bundle.md"
          test ! -L "$out/bundle.md"
          test -s "$out/bundle.md"
          test "$(wc -c < "$out/bundle.md")" -le 200000
          echo "path=/github/workspace/review-context/bundle.md" >> "$GITHUB_OUTPUT"

      # Post as the "PR Agent" GitHub App instead of github-actions[bot] once its client ID
      # variable and private key secret are configured; until then the workflow token is used.
      - name: Create PR Agent app token
        id: app-token
        if: vars.PR_AGENT_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.PR_AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.PR_AGENT_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write

      - name: Run sponsored PR-Agent
        uses: docker://pragent/pr-agent:github_action
        with:
          entrypoint: /bin/sh
          args: >-
            -c "export GITHUB_EVENT_NAME=$PR_AGENT_EVENT_NAME;
            export GITHUB_EVENT_PATH=$PR_AGENT_EVENT_PATH;
            exec /entrypoint.sh"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          ARTIFACT_PATH: ${{ steps.context-artifact.outcome == 'success' && steps.context-artifact.outputs.path || '' }}
          ARTIFACT_INSTRUCTIONS: ${{ steps.context-artifact.outcome == 'success' && needs.prepare_review.outputs.instructions || '' }}
          # The image follows the latest release: v0.50.0 reads TARGET_TOOLS, releases after #4838 read
          # TARGET_COMMANDS. Drop TARGET_TOOLS once the image includes #4838.
          ARTIFACTS__TARGET_TOOLS: '["pr_reviewer"]'
          ARTIFACTS__TARGET_COMMANDS: '["pr_reviewer"]'
          # The app token posts as `<app-slug>[bot]` and cannot call `GET /user`, so name that login
          # for the comment-authorship checks; empty keeps the `github-actions[bot]` fallback.
          GITHUB__AGENT_LOGIN: ${{ steps.app-token.outputs.app-slug && format('{0}[bot]', steps.app-token.outputs.app-slug) || '' }}
          PR_AGENT_EVENT_NAME: ${{ needs.prepare_review.outputs.event_name }}
          PR_AGENT_EVENT_PATH: ${{ github.event_name == 'workflow_dispatch' && '/github/workspace/pr-agent-event.json' || '/github/workflow/event.json' }}
          OPENAI_KEY: ${{ secrets.QODO_SPONSORSHIP_LLM_KEY }}
          CONFIG__MODEL: openai/gpt-6.1-sol
          CONFIG__MODEL_WEAK: openai/gpt-6.1-sol
          CONFIG__MODEL_REASONING: openai/gpt-6.1-sol
          CONFIG__FALLBACK_MODELS: '[]'
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: '32000'
          CONFIG__NO_TEMPERATURE_MODELS: '["gpt-6.1-sol"]'
          CONFIG__MAX_OUTPUT_TOKENS: '8192'
          CONFIG__LOG_LEVEL: INFO
          CONFIG__OUTPUT_RUN_DETAILS: 'true'
          # The action would also merge this repo's own .pr_agent.toml, whose `synchronize`
          # push command points at /agentic_review - not in OSS, so it would fail the job.
          CONFIG__USE_REPO_SETTINGS_FILE: 'false'
          # Write the generated description into the PR body, keeping the author's text in it.
          PR_DESCRIPTION__PUBLISH_DESCRIPTION_AS_COMMENT: 'false'
          PR_DESCRIPTION__ADD_ORIGINAL_USER_DESCRIPTION: 'true'
          # The default "only critical problems" filter returns an empty list on most PRs here,
          # which made 90 of 99 /improve comments say "No code suggestions found" (#4161).
          PR_CODE_SUGGESTIONS__FOCUS_ONLY_ON_PROBLEMS: 'false'
          # Confirm that /improve ran even when no suggestions remain after filtering.
          PR_CODE_SUGGESTIONS__PUBLISH_OUTPUT_NO_SUGGESTIONS: 'true'
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: 'true'
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: 'true'
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: 'true'
          GITHUB_ACTION_CONFIG__FAIL_ON_COMMAND_ERRORS: 'true'
