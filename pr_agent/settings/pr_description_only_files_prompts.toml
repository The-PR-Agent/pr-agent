    ...
{%- if include_file_summary_changes %}
  changes_summary: |
    ...
{%- endif %}
  changes_title: |
    ...
  label: |
    label_key_1
...
```
(replace '...' with the actual values)
{%- endif %}


Response (should be a valid YAML, and nothing else):
```yaml
"""
