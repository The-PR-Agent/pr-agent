[prompt_fragments]
diff_hunk_format="""======
## File: 'src/file1.py'
{% if include_ai_metadata %}
### AI-generated changes summary:
* ...
* ...
{% endif %}

@@ ... @@ def func1():
__new hunk__
{% if include_line_numbers %}
11  unchanged code line0
12  unchanged code line1
13 +new code line2 added
14  unchanged code line3
{% else %}
 unchanged code line0
 unchanged code line1
+new code line2 added
 unchanged code line3
{% endif %}
__old hunk__
 unchanged code line0
 unchanged code line1
-old code line2 removed
 unchanged code line3

@@ ... @@ def func2():
__new hunk__
{% if include_line_numbers %}
21  unchanged code line4
22 +new code line5 added
23  unchanged code line6
{% else %}
 unchanged code line4
+new code line5 added
 unchanged code line6
{% endif %}

## File: 'src/file2.py'
...
======

- Each code chunk is split into separate '__new hunk__' and '__old hunk__' sections. The '__new hunk__' section
  shows the code chunk after the PR changes. The '__old hunk__' section shows the code chunk before the PR changes
  and is omitted when the chunk contains no removed code.
{% if include_line_numbers %}
- Line numbers appear before the change marker in '__new hunk__' sections to help you refer to specific lines.
  These numbers are for reference only and are not part of the code. '__old hunk__' sections are not numbered.
{% endif %}
- Change markers describe how each line differs: '+' marks added code and appears only in '__new hunk__', '-'
  marks removed code and appears only in '__old hunk__', and ' ' marks unchanged context that appears in both.
{% if include_ai_metadata %}
- If available, an AI-generated summary will appear and provide a high-level overview of the file changes. This
  summary may not be fully accurate or complete.
{% endif %}"""

# Wording of the review prompt's key-issues field. It lives here, not inline in
# pr_reviewer_prompts.toml, so a wording experiment is a `--set prompt_fragments.findings_field=...`
# override rather than an edit to the prompt file - two eval rows that differ by an edited file are
# not comparable. Rendered with `num_max_findings`. The result is inserted inside Field("...") in the
# prompt's pseudo-schema, so the value must not contain a double quote.
findings_field="""A concise list (0-{{ num_max_findings }} issues) of bugs, security vulnerabilities, or significant performance concerns introduced in this PR. Only include issues you are confident about. If confidence is limited but the potential impact is high (e.g., data loss, security), you may include it only if you explicitly note what remains uncertain. Each issue must identify a concrete problem with a realistic trigger scenario. An empty list is acceptable if no clear issues are found."""
