# NOTE: This file is consumed by Qodo's "free for open source" agent
# (the `qodo-free-for-open-source-projects` bot) — a separate, hosted, closed-source
# service. Some keys below (e.g. the [review_agent] section) only exist in that hosted agent.
#
# The open-source pr-agent run by .github/workflows/pr-agent-review.yaml reads it too and
# applies the keys it recognises (e.g. [pr_reviewer]). The workflow's environment settings
# take precedence, and it does not use the [github_app] command lists.

[pr_reviewer]
enable_review_labels_effort = true
enable_auto_approval = true
persistent_finding_state = true

[github_app]
pr_commands = [
    "/describe --pr_description.publish_description_as_comment=true",
    "/improve",
    "/agentic_review"
]

handle_push_trigger = true
push_commands = [
    "/improve",
    "/agentic_review"
]

[review_agent]
enabled = true
publish_output = true
demand_self_review = true
approve_pr_on_self_review = true
